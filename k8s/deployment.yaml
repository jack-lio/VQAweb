apiVersion: apps/v1
kind: Deployment
metadata:
  name: vqaweb
  labels:
    app: vqaweb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vqaweb
  template:
    metadata:
      labels:
        app: vqaweb
    spec:
      containers:
        - name: vqaweb
          image: vqaweb:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BACKEND_PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vqaweb
spec:
  selector:
    app: vqaweb
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
