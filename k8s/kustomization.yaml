apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deployed to minikube by ArgoCD (Application "vqaweb" in jack-lio/sql-k8s).
namespace: default

resources:
  - deployment.yaml

# CI (.github/workflows/ci-cd.yml) sets newName/newTag to the image it pushed.
images:
  - name: vqaweb
    newName: vqaweb
    newTag: latest
