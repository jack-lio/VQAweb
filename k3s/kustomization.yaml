apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aqi

resources:
  - namespace.yaml
  - backend-service.yaml
  # The PyTorch prediction backend is not deployed yet. Uncomment to enable;
  # deploy.sh then builds and imports the backend image as well.
  # - backend.yaml
  - frontend.yaml
  - ingress.yaml

# The generated name gets a content hash, so editing nginx/default.conf
# rolls the frontend pods automatically.
configMapGenerator:
  - name: aqi-frontend-nginx
    files:
      - nginx/default.conf

# deploy.sh rewrites both newTag values on every deploy.
images:
  - name: aqi-backend
    newTag: dev
  - name: aqi-frontend
    newTag: dev
