apiVersion: apps/v1
kind: Deployment
metadata:
  name: aqi-backend
  labels:
    app: aqi-backend
spec:
  # Keep a single replica: feature_manager.py builds its feature extractors
  # with random weights, so separate pods can return different predictions.
  replicas: 1
  selector:
    matchLabels:
      app: aqi-backend
  template:
    metadata:
      labels:
        app: aqi-backend
    spec:
      containers:
        - name: backend
          image: aqi-backend
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          # Loading torch and five models takes a while on a Pi; liveness and
          # readiness only start once this succeeds (up to 5 minutes).
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
