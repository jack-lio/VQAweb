name: Local Docker CI

on:
  push:
    branches:
      - AQI
  workflow_dispatch:

jobs:
  local-docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build local image
        run: |
          docker compose -f local-run/docker-compose.yml build

      - name: Start local container
        run: |
          docker compose -f local-run/docker-compose.yml up -d

      - name: Wait for health check
        run: |
          for i in {1..120}; do
            if curl -fsS http://localhost:8080/api/health; then
              exit 0
            fi
            docker compose -f local-run/docker-compose.yml logs --tail=40
            sleep 2
          done
          exit 1

      - name: Stop local container
        if: always()
        run: docker compose -f local-run/docker-compose.yml down
